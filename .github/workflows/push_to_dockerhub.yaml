name: Create and push image to dockerhub

on:
  push:
    branches: ["stable", "bare-metal-deployment"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: bare-metal-environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Log environment image name and registry
        run: |
          echo $IMAGE_NAME 
          echo $REGISTRY
      
      - name: Log in to dockerhub
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Get tags for docker image
        id: meta
        uses: docker/metadata-action@v4.6.0
        with:
          images: $REGISTRY/$IMAGE_NAME
      
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4.1.1
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }} #
          labels: ${{ steps.meta.outputs.labels }}
