apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-pos-server
spec:
  selector:
    matchLabels:
      app: go-pos-server
  template:
    metadata:
      labels:
        app: go-pos-server
    spec:
      containers:
      - name: go-pos-server
        image: callspadeoz123/go-pos:latest
        env:
        - name: APP_ENV
          valueFrom:
            secretKeyRef:
              name: go-pos-secret
              key: APP_ENV
        - name: APP_NAME
          valueFrom:
            secretKeyRef:
              name: go-pos-secret
              key: APP_NAME
        - name: HTTP_URL
          valueFrom:
            secretKeyRef:
              name: go-pos-secret
              key: HTTP_URL
        - name: HTTP_ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: go-pos-secret
              key: HTTP_ALLOWED_ORIGINS
        - name: TOKEN_DURATION
          valueFrom:
            secretKeyRef:
              name: go-pos-secret
              key: TOKEN_DURATION
        - name: HTTP_PORT
          valueFrom:
            secretKeyRef:
              name: go-pos-secret
              key: HTTP_PORT
        - name: DB_CONNECTION
          valueFrom:
            secretKeyRef:
              name: go-pos-secret
              key: DB_CONNECTION
        - name: DB_HOST
          value: postgres-service
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: REDIS_ADDR
          value: "redis-service:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: REDIS_PASSWORD
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
